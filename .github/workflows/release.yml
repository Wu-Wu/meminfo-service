name: Build and Release

# Публикация: git tag v<X.Y.Z> (совпадает с VERSION в vars.yaml) -> сборка на
# нативных раннерах обеих арок -> мультиарх-манифест <tag> и latest в
# ghcr.io/wu-wu/meminfo-service (пуш встроенным GITHUB_TOKEN, секреты не нужны)
# -> GitHub release с адресами образов.
# Требуется заранее: ghcr-пакет создаётся первым пушем под GITHUB_TOKEN.
# Опционально (приватный registry за docker_auth): variables
# PVTHUB_HOSTNAME/PVTHUB_USERNAME + secret PVTHUB_PASSWORD. В него publish
# льёт только мультиарх-манифесты (<tag>/latest, исходники — ghcr arch-теги),
# в Step Summary и release notes он не упоминается намеренно. Это best-effort:
# сбой приватного реестра даёт ::warning::/красный шаг и не валит пайплайн.
# PVTHUB_HOSTNAME пуст -> приватные шаги пропускаются.
# PR собирают без публикации.

on:
  push:
    tags:
      - v*
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_GHCR: ghcr.io/wu-wu/meminfo-service
  # пустой PVTHUB_HOSTNAME -> пустая строка -> приватные шаги пропускаются
  IMAGE_PVTHUB: ${{ vars.PVTHUB_HOSTNAME != '' && format('{0}/talos/meminfo-service', vars.PVTHUB_HOSTNAME) || '' }}

jobs:
  build:
    permissions:
      packages: write   # пуш промежуточных -amd64/-arm64 в ghcr под GITHUB_TOKEN
    strategy:
      fail-fast: false   # падение одной арки не отменяет вторую
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm   # нативный arm64, бесплатно для публичных репо
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v7

      - name: Check version consistency
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          v=$(sed -En 's/^VERSION: *"?([^"]+)"?$/\1/p' vars.yaml)
          if [ "$v" != "${GITHUB_REF_NAME}" ]; then
            echo "vars.yaml VERSION=$v does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (native ${{ matrix.arch }})
        env:
          PUBLISH: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          # PR builds get a sha tag and are never published (GITHUB_REF_NAME
          # on a PR is "N/merge", the slash is not a valid docker tag char)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="sha-${GITHUB_SHA::12}"; fi
          export OUT_IMAGE="$IMAGE_GHCR:${TAG}-${{ matrix.arch }}"
          if [ "$PUBLISH" = true ]; then
            make arch-push ARCH=${{ matrix.arch }}
          else
            make arch-build ARCH=${{ matrix.arch }}
          fi
        shell: bash

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to private registry
        if: vars.PVTHUB_HOSTNAME != ''
        continue-on-error: true   # best-effort
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.PVTHUB_HOSTNAME }}
          username: ${{ vars.PVTHUB_USERNAME }}
          password: ${{ secrets.PVTHUB_PASSWORD }}

      - name: Compose multi-arch manifest
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="sha-${GITHUB_SHA::12}"; fi
          # manual dispatch = smoke-build: публикуем только sha-<12>,
          # latest двигает исключительно релизный push-тег
          latest=()
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            latest=(-t "$IMAGE_GHCR:latest")
          fi
          docker buildx imagetools create \
            -t "$IMAGE_GHCR:$TAG" "${latest[@]}" \
            "$IMAGE_GHCR:$TAG-amd64" "$IMAGE_GHCR:$TAG-arm64"
          {
            echo "## Итог"
            echo '```'
            docker buildx imagetools inspect "$IMAGE_GHCR:$TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Publish private registry manifest (best-effort)
        if: vars.PVTHUB_HOSTNAME != ''
        continue-on-error: true   # сбой приватного реестра не валит publish
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="sha-${GITHUB_SHA::12}"; fi
          # в приватный реестр уходят только мультиарх-манифесты; исходники —
          # ghcr arch-теги, blobs копируются cross-registry
          latest=()
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            latest=(-t "$IMAGE_PVTHUB:latest")
          fi
          docker buildx imagetools create \
            -t "$IMAGE_PVTHUB:$TAG" "${latest[@]}" \
            "$IMAGE_GHCR:$TAG-amd64" "$IMAGE_GHCR:$TAG-arm64"
        shell: bash

  release:
    needs: [build, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_GHCR: ${{ env.IMAGE_GHCR }}
        run: |
          set -euo pipefail
          # heredoc без кавычек: $-переменные нужны, но markdown-бэктики
          # экранируем, иначе bash выполняет их как command substitution
          cat > notes.md <<EOF
          meminfo Talos system extension \`${GITHUB_REF_NAME}\` — multi-arch amd64+arm64.

          Container image for this release (system extension, use via
          \`--system-extension-image\`):
          - GitHub Container Registry: \`${IMAGE_GHCR}:${GITHUB_REF_NAME}\`
          EOF
          # job без checkout: gh не определит репо из git, нужен явный -R
          if gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
          fi
        shell: bash
